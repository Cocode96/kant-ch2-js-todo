<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 Todo</title><link rel="stylesheet" href="css/style.css"><script src="js/todo.js" defer></script></head>
<body><main><h1>나의 Todo</h1><p>추가하고, 조회하고, 수정하고, 삭제합니다.</p>
<form id="todo-form">
<label>날짜 <input name="date" type="date" required></label>
<label>제목 <input name="title" maxlength="100" required></label>
<label>내용 <textarea name="content" maxlength="1000" required></textarea></label>
<div><button type="submit" id="save-button">추가</button> <button type="button" id="cancel-button" hidden>수정 취소</button></div>
</form>
<p id="message" role="status"></p>
<label>조회 <input id="search" type="search" placeholder="제목 또는 내용 검색"></label>
<p id="count"></p><ul id="todo-items"></ul>
</main></body></html>
